<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root {
  color-scheme: dark;
  --bg: #131211; --bg2: #171615; --panel: #1e1c1a; --panel2: #262321; --panel3: #2f2b28;
  --line: rgba(255,255,255,.07); --line2: rgba(255,255,255,.12);
  --ink: #f3efe8; --ink2: #d6d0c6; --muted: #9c968c; --faint: #6c665e;
  --accent: #e5875c; --accent2: #c9643b; --accent-soft: rgba(229,135,92,.14); --accent-line: rgba(229,135,92,.45);
  --ok: #62c48e; --ok-soft: rgba(98,196,142,.14); --warn: #e6b450; --warn-soft: rgba(230,180,80,.14);
  --bad: #f06c60; --bad-soft: rgba(240,108,96,.14);
  --user: #2b2724; --code: #0f0e0d; --shadow: 0 10px 40px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.25);
  --glow: radial-gradient(1200px 500px at 50% -180px, rgba(229,135,92,.10), transparent 70%);
  --serif: "Instrument Serif", Georgia, serif;
  --sans: "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", Consolas, ui-monospace, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg: #faf8f4; --bg2: #f3f0ea; --panel: #ffffff; --panel2: #f5f2ec; --panel3: #ebe6de;
    --line: rgba(40,28,15,.08); --line2: rgba(40,28,15,.14);
    --ink: #23201c; --ink2: #3d3933; --muted: #6f695f; --faint: #a39d93;
    --accent: #c8643b; --accent2: #b0532d; --accent-soft: rgba(200,100,59,.10); --accent-line: rgba(200,100,59,.45);
    --ok: #2f8f5b; --ok-soft: rgba(47,143,91,.10); --warn: #b07d16; --warn-soft: rgba(176,125,22,.12);
    --bad: #c4392d; --bad-soft: rgba(196,57,45,.09);
    --user: #efe9df; --code: #f6f3ee; --shadow: 0 10px 40px rgba(60,40,20,.12), 0 2px 8px rgba(60,40,20,.06);
    --glow: radial-gradient(1200px 500px at 50% -180px, rgba(200,100,59,.08), transparent 70%);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:disabled { opacity: .4; cursor: default; }
input, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 15px; height: 15px; }
svg.i.xs { width: 13px; height: 13px; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }
::selection { background: var(--accent-soft); }

#app { display: flex; height: 100vh; height: 100dvh; }

/* ---------- buttons */
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); font-size: 14px; font-weight: 500; transition: background .15s, border-color .15s, transform .1s; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--panel3); border-color: var(--line2); }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn.primary { background: linear-gradient(180deg, var(--accent), var(--accent2)); border-color: transparent; color: #fff; box-shadow: 0 2px 10px rgba(201,100,59,.3); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.06); background: linear-gradient(180deg, var(--accent), var(--accent2)); }
.btn.danger { color: var(--bad); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover:not(:disabled) { background: var(--panel2); }
.btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.iconbtn { width: 36px; height: 36px; display: inline-grid; place-items: center; border-radius: 10px; color: var(--muted); transition: background .15s, color .15s; }
.iconbtn:hover:not(:disabled) { background: var(--panel2); color: var(--ink); }

/* ---------- sidebar */
#side { width: 300px; flex: none; display: flex; flex-direction: column; background: var(--bg2); border-right: 1px solid var(--line); z-index: 30; }
.brand { display: flex; align-items: center; gap: 10px; padding: 16px 16px 10px; }
.brand .logo { width: 30px; height: 30px; }
.brand .word { font-family: var(--serif); font-size: 25px; letter-spacing: .2px; line-height: 1; }
.brand .word i { color: var(--accent); font-style: italic; }
.brand .close { margin-left: auto; display: none; }
.sidetools { display: flex; gap: 8px; padding: 6px 12px 10px; }
.sideacts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 4px 12px 2px; }
.sact { display: flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 10px; border-radius: 10px; font-size: 13.5px; font-weight: 500; background: var(--panel2); border: 1px solid var(--line); color: var(--ink2); transition: border-color .15s, color .15s, background .15s; white-space: nowrap; }
.sact:hover { border-color: var(--line2); color: var(--ink); background: var(--panel3); }
.sact svg { color: var(--accent); }
.qmore { display: block; width: 100%; text-align: left; padding: 4px 10px 4px 35px; font-size: 12.5px; color: var(--faint); border-radius: 8px; }
.qmore:hover { color: var(--ink2); }
.np label.fl { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 0 0 6px; }
.np textarea, .np input[type=text], .np select { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line2); background: var(--panel2); outline: 0; font-size: 14.5px; }
.np textarea { resize: vertical; min-height: 96px; line-height: 1.45; }
.np textarea:focus, .np input[type=text]:focus, .np select:focus { border-color: var(--accent); }
.np select { appearance: auto; }
.np .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.np .where { margin-top: 8px; font: 12px var(--mono); color: var(--faint); overflow-wrap: anywhere; }
.np .sec { margin-top: 16px; }
.np .hint2 { font-size: 12px; color: var(--faint); margin: 0; }
.nptray { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.nptray:empty { display: none; }
.np .nprow { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.np .chk { display: flex; gap: 8px; align-items: center; margin-top: 14px; font-size: 13.5px; color: var(--ink2); }
.np .what { margin: 14px 0 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
@media (max-width: 560px) { .np .row2 { grid-template-columns: 1fr; } }
.findbtn { flex: 1; display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; color: var(--muted); font-size: 14px; transition: border-color .15s, color .15s; }
.findbtn:hover { border-color: var(--line2); color: var(--ink2); }
.findbtn kbd { margin-left: auto; font: 500 11px var(--sans); color: var(--faint); border: 1px solid var(--line2); border-radius: 5px; padding: 1px 5px; }
#plist { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
.group { padding: 14px 10px 5px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); display: flex; align-items: center; gap: 6px; }
.proj { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 9px; cursor: pointer; color: var(--ink2); font-size: 14px; position: relative; transition: background .12s; }
.proj:hover { background: var(--panel); }
.proj.sel { background: var(--panel2); color: var(--ink); font-weight: 500; }
.proj.sel::before { content: ""; position: absolute; left: -8px; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; background: var(--accent); }
.proj .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj .ic { color: var(--faint); }
.proj.sel .ic { color: var(--accent); }
.proj .tag { font-size: 11px; color: var(--faint); }
.proj .pinb { width: 24px; height: 24px; margin: -4px -4px -4px 0; border-radius: 7px; display: none; place-items: center; color: var(--faint); flex: none; }
.proj .pinb:hover { background: var(--panel3); color: var(--ink); }
.proj:hover .pinb { display: inline-grid; }
@media (pointer: coarse) { .proj .pinb.xb { display: inline-grid; } }
.proj:hover .tag, .proj:hover .ago { display: none; }
.proj.main { padding: 8px 10px; gap: 11px; }
.proj.main .tile { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: none; font: 600 14px var(--sans); color: #fff; background: var(--tile, var(--panel3)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.dlist .proj { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.dlist { position: relative; }
.dlist.sorting .proj { transition: transform .2s cubic-bezier(.2,.8,.2,1); }
.proj.dragging { background: var(--panel3); box-shadow: 0 10px 28px rgba(0,0,0,.35), 0 0 0 1px var(--line2); z-index: 2; cursor: grabbing; scale: 1.03; transition: scale .15s cubic-bezier(.2,.8,.2,1), box-shadow .15s !important; }
.proj.dragging.landing { scale: 1; box-shadow: 0 0 0 0 transparent; }
.proj.dragging::before { display: none; }
#plist.dragging, #plist.dragging .proj { cursor: grabbing; }
#plist.dragging .proj:not(.dragging):hover { background: transparent; }
#plist.dragging .pinb { display: none !important; }
.proj.main .nm2 { flex: 1; min-width: 0; line-height: 1.25; }
.proj.main .nm2 b { display: block; font-weight: 500; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14.5px; }
.proj.main .nm2 small { display: block; color: var(--faint); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj.main.sel::before { top: 10px; bottom: 10px; }
.proj .ago { font-size: 11.5px; color: var(--faint); flex: none; }
.pinhint { margin: 2px 4px 6px; padding: 14px; border: 1px dashed var(--line2); border-radius: 12px; color: var(--muted); font-size: 13px; line-height: 1.5; }
.pinhint button { margin-top: 10px; }
.allbtn { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px; margin-top: 10px; border-radius: 9px; color: var(--muted); font-size: 13.5px; transition: background .12s, color .12s; }
.allbtn:hover { background: var(--panel); color: var(--ink); }
.allbtn span { margin-left: auto; font-size: 12px; color: var(--faint); }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: pulse 1.6s infinite; flex: none; }
.live-dot.ask { background: var(--accent); animation: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.live-dot.rest { background: var(--warn); animation: none; }
.live-dot.done { background: #5aa9e6; animation: none; box-shadow: 0 0 0 3px rgba(90,169,230,.18); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(98,196,142,.55); } 70% { box-shadow: 0 0 0 7px rgba(98,196,142,0); } 100% { box-shadow: 0 0 0 0 rgba(98,196,142,0); } }

.acctwrap { position: relative; flex: 1; min-width: 0; }
.acctbtn { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 10px; color: var(--muted); font-size: 13px; width: 100%; transition: background .12s, color .12s; }
.acctbtn:hover, .acctwrap.open .acctbtn { background: var(--panel); color: var(--ink2); }
.adots { display: inline-flex; gap: 4px; }
.adot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.adot.active { background: var(--accent); }
.adot.rest { background: transparent; box-shadow: inset 0 0 0 1.5px var(--faint); }
.adot.off { background: transparent; box-shadow: inset 0 0 0 1.5px var(--faint); opacity: .5; }
#acctpop { position: absolute; left: -4px; bottom: 100%; width: 284px; padding-bottom: 8px; display: none; z-index: 40; }
.acctwrap.open #acctpop { display: block; }
@media (hover: hover) { .acctwrap:hover #acctpop { display: block; } }
.apcard { background: var(--bg2); border: 1px solid var(--line2); border-radius: 14px; box-shadow: var(--shadow); padding: 10px; animation: pop .14s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(4px); } }
.aph { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 8px; font-size: 12px; color: var(--faint); }
.aph button { font-size: 12px; color: var(--muted); display: inline-flex; gap: 5px; align-items: center; padding: 3px 6px; border-radius: 6px; }
.aph button:hover { background: var(--panel2); color: var(--ink); }
#accts { display: grid; gap: 6px; }
.acct { padding: 9px 11px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-size: 12.5px; position: relative; transition: border-color .2s; }
.acct.active { border-color: var(--accent-line); }
.acct.out { opacity: .6; }
.acct .row1 { display: flex; align-items: center; gap: 8px; }
.acct .num { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font-weight: 700; font-size: 12px; background: var(--panel3); color: var(--ink2); flex: none; }
.acct.active .num { background: var(--accent); color: #fff; }
.acct .em { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink2); font-weight: 500; }
.pill { font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; letter-spacing: .02em; }
.pill.active { background: var(--accent-soft); color: var(--accent); }
.pill.ready { background: var(--panel3); color: var(--muted); }
.pill.out { background: var(--panel3); color: var(--faint); }
.pill.near { background: var(--warn-soft); color: var(--warn); }
.pill.off { border: 1px dashed var(--faint); color: var(--muted); }
.meters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
.meter .lbl { display: flex; justify-content: space-between; color: var(--faint); font-size: 11px; }
.meter .lbl b { color: var(--ink2); font-weight: 600; }
.bar { height: 4px; background: var(--panel3); border-radius: 4px; overflow: hidden; margin-top: 3px; }
.bar > i { display: block; height: 100%; border-radius: 4px; background: var(--muted); opacity: .7; transition: width .6s; }
.bar > i.full { background: var(--faint); }
.acct .st { color: var(--faint); font-size: 11.5px; margin-top: 6px; }
.acct .st a { color: var(--accent); cursor: pointer; }
.sidefoot { display: flex; gap: 2px; padding: 8px 8px 10px; align-items: center; border-top: 1px solid var(--line); }
.sidefoot .iconbtn { width: 34px; height: 34px; }

/* ---------- all-projects finder */
#pal { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.5); display: none; align-items: flex-start; justify-content: center; padding: 10vh 16px 16px; }
#pal.show { display: flex; }
.palc { width: min(620px, 100%); max-height: 76vh; display: flex; flex-direction: column; background: var(--bg2); border: 1px solid var(--line2); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; animation: pop .16s ease-out; }
.palin { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); color: var(--muted); }
.palin input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 16px; color: var(--ink); }
.pall { overflow-y: auto; padding: 6px 8px 10px; }
.pg { display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 10px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--ink2); }
.pg:hover { background: var(--panel); }
.pg .cnt { color: var(--faint); font-weight: 500; }
.pg svg { color: var(--faint); transition: transform .15s; }
.pg.open svg.chev { transform: rotate(90deg); }
.prow { display: flex; align-items: center; gap: 10px; padding: 7px 10px 7px 30px; border-radius: 9px; cursor: pointer; font-size: 14px; color: var(--ink2); }
.pall.flat .prow { padding-left: 10px; }
.prow.nest { padding-left: 50px; }
.psub { display: flex; align-items: center; gap: 7px; padding: 8px 10px 3px 30px; font-size: 12px; font-weight: 600; color: var(--muted); }
.psub svg { color: var(--faint); }
.prow:hover, .prow.hl { background: var(--panel2); color: var(--ink); }
.prow .ic { color: var(--faint); }
.prow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .sub { color: var(--faint); font-size: 12px; }
.prow .star { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--faint); flex: none; }
.prow .star:hover { background: var(--panel3); color: var(--ink); }
.prow .star.on { color: var(--accent); }
.prow .star.on svg { fill: currentColor; }
.palf { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--faint); }
.palf .btn { margin-left: auto; }

/* ---------- old conversation view */
#pastbar { display: none; align-items: center; gap: 10px; padding: 9px 16px; background: var(--panel); border-bottom: 1px solid var(--line); font-size: 13.5px; color: var(--ink2); }
#pastbar.show { display: flex; }
#pastbar .btn { margin-left: auto; }
.pastlist { display: grid; gap: 6px; max-height: 60vh; overflow-y: auto; }
.pastlist button { display: block; text-align: left; padding: 10px 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
.pastlist button:hover { border-color: var(--line2); background: var(--panel2); }
.pastlist b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pastlist small { color: var(--faint); font-size: 12px; }

.iconbtn.pinned { color: var(--accent); }
.iconbtn.pinned svg { fill: currentColor; }

/* ---------- main */
#main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; background: var(--glow), var(--bg); }
#top { display: flex; align-items: center; gap: 10px; padding: 10px 16px; min-height: 58px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(12px); z-index: 5; }
#menuBtn { display: none; }
.ptitle { min-width: 0; flex: 1; }
.ptitle .t { font-weight: 600; font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ptitle .m { display: flex; gap: 6px; align-items: center; flex-wrap: nowrap; overflow: hidden; color: var(--muted); font-size: 12.5px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 99px; background: var(--panel2); border: 1px solid var(--line); font-size: 11.5px; white-space: nowrap; color: var(--muted); }
.chip.ok { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
.chip.warn { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.topacts { display: flex; gap: 4px; align-items: center; }

#banner { display: none; margin: 12px auto 0; width: min(780px, calc(100% - 32px)); padding: 14px 18px; border-radius: var(--r); background: linear-gradient(135deg, var(--warn-soft), var(--accent-soft)); border: 1px solid var(--line2); align-items: center; gap: 14px; flex-wrap: wrap; }
#banner.show { display: flex; }
#banner .big { font-family: var(--mono); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }

#scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; scroll-behavior: auto; }
#chat { width: min(780px, 100%); margin: 0 auto; padding: 24px 20px 30px; display: flex; flex-direction: column; gap: 14px; }

/* hero / empty */
.hero { margin: 11vh auto 0; text-align: center; max-width: 560px; padding: 0 10px; animation: rise .5s ease both; }
.hero .logo { width: 54px; height: 54px; margin-bottom: 18px; filter: drop-shadow(0 6px 24px rgba(229,135,92,.35)); }
.hero h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(30px, 5vw, 42px); line-height: 1.15; margin: 0 0 10px; letter-spacing: -.2px; }
.hero h1 em { color: var(--accent); }
.hero p { color: var(--muted); margin: 0 0 22px; }
.sugg { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.sugg button { padding: 9px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); color: var(--ink2); font-size: 13.5px; transition: border-color .15s, transform .15s, background .15s; }
.sugg button:hover { border-color: var(--accent-line); background: var(--panel2); transform: translateY(-1px); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* messages */
.msg { animation: rise .25s ease both; }
.msg.user { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.msg.user .b { background: var(--user); padding: 10px 15px; border-radius: 18px 18px 6px 18px; max-width: 85%; white-space: pre-wrap; word-wrap: break-word; }
.atts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; max-width: 85%; }
.atts img { height: 110px; max-width: 220px; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); cursor: zoom-in; display: block; }
.fchip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); font-size: 13px; color: var(--ink2); text-decoration: none; max-width: 240px; }
.fchip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msg.assistant { position: relative; }
.msg.shared .shown { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.msg.shared .shown img { max-width: min(100%, 420px); max-height: 420px; border-radius: 12px; border: 1px solid var(--line); cursor: zoom-in; display: block; }
.msg.shared .shown video { max-width: 100%; max-height: 420px; border-radius: 12px; background: #000; }
.msg.assistant .who { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--faint); margin-bottom: 2px; }
.msg.assistant .who img { width: 16px; height: 16px; }
.msg.assistant .acts { position: absolute; right: 0; top: -4px; opacity: 0; transition: opacity .15s; display: flex; gap: 2px; }
.msg.assistant:hover .acts { opacity: 1; }
.msg.assistant .acts .iconbtn { width: 28px; height: 28px; }
.md { font-size: 15.5px; line-height: 1.68; color: var(--ink); word-wrap: break-word; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p { margin: .55em 0; }
.md h1, .md h2, .md h3, .md h4 { line-height: 1.3; margin: 1.1em 0 .45em; font-weight: 600; }
.md h1 { font-size: 1.35em; } .md h2 { font-size: 1.2em; } .md h3 { font-size: 1.06em; } .md h4 { font-size: 1em; }
.md ul, .md ol { padding-left: 1.4em; margin: .5em 0; } .md li { margin: .2em 0; } .md li::marker { color: var(--faint); }
.md blockquote { margin: .7em 0; padding: .2em 1em; border-left: 3px solid var(--accent-line); color: var(--ink2); }
.md hr { border: 0; border-top: 1px solid var(--line2); margin: 1.2em 0; }
.md table { border-collapse: collapse; margin: .8em 0; font-size: 14px; display: block; overflow-x: auto; max-width: 100%; }
.md th, .md td { border: 1px solid var(--line2); padding: 6px 11px; text-align: left; }
.md th { background: var(--panel2); font-weight: 600; }
.md code { font-family: var(--mono); font-size: .86em; background: var(--panel2); border: 1px solid var(--line); padding: .1em .38em; border-radius: 6px; }
.md a { text-decoration: none; border-bottom: 1px solid var(--accent-line); }
.md img { max-width: 100%; border-radius: 10px; }
.codeblk { margin: .8em 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--code); }
.codeblk .ch { display: flex; align-items: center; justify-content: space-between; padding: 5px 8px 5px 14px; font: 12px var(--mono); color: var(--faint); background: var(--panel); border-bottom: 1px solid var(--line); }
.codeblk .ch button { display: inline-flex; gap: 5px; align-items: center; padding: 3px 8px; border-radius: 6px; font-size: 12px; color: var(--muted); }
.codeblk .ch button:hover { background: var(--panel2); color: var(--ink); }
.codeblk pre { margin: 0; padding: 12px 14px; overflow-x: auto; font: 13px/1.6 var(--mono); }
.codeblk pre code { background: none; border: 0; padding: 0; font-size: inherit; }
.codeblk .cbtns { display: inline-flex; gap: 2px; }
.codeblk .ch button[data-run] { color: var(--accent, var(--ink)); }
.codeblk .ch button:disabled { opacity: .7; cursor: default; }
.codeblk .ch .spin { display: inline-block; width: 10px; height: 10px; }
.codeblk .runout { border-top: 1px solid var(--line); }
.codeblk .runout .rh { padding: 4px 14px; font: 11px var(--mono); color: var(--faint); background: var(--panel); text-transform: uppercase; letter-spacing: .04em; }
.codeblk .runout.bad .rh { color: var(--bad, #d55); }
.codeblk .runout pre { max-height: 320px; overflow: auto; font-size: 12px; }
.hljs-keyword, .hljs-selector-tag, .hljs-built_in, .hljs-doctag { color: #e5875c; }
.hljs-string, .hljs-regexp, .hljs-attr-value, .hljs-template-tag { color: #98c379; }
.hljs-number, .hljs-literal, .hljs-symbol, .hljs-bullet { color: #d19a66; }
.hljs-title, .hljs-section, .hljs-function .hljs-title, .hljs-title.function_ { color: #7cb7ff; }
.hljs-attr, .hljs-attribute, .hljs-variable, .hljs-property, .hljs-params { color: #e6c07b; }
.hljs-comment, .hljs-quote { color: var(--faint); font-style: italic; }
.hljs-type, .hljs-class .hljs-title, .hljs-title.class_ { color: #c49cf2; }
.hljs-meta, .hljs-tag, .hljs-name { color: #7fc8c8; }
.hljs-addition { color: var(--ok); } .hljs-deletion { color: var(--bad); }
@media (prefers-color-scheme: light) {
  .hljs-keyword, .hljs-selector-tag, .hljs-built_in, .hljs-doctag { color: #b4502b; }
  .hljs-string, .hljs-regexp { color: #3c7a2a; } .hljs-number, .hljs-literal { color: #9a5b12; }
  .hljs-title, .hljs-title.function_ { color: #2b5fb4; } .hljs-attr, .hljs-variable, .hljs-property, .hljs-params { color: #8a6200; }
  .hljs-type, .hljs-title.class_ { color: #7b3fbf; } .hljs-meta, .hljs-tag, .hljs-name { color: #1d7a7a; }
}

/* thinking */
.think { border-radius: 12px; color: var(--muted); font-size: 13.5px; }
.think summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px 4px 8px; border-radius: 99px; color: var(--muted); user-select: none; }
.think summary::-webkit-details-marker { display: none; }
.think summary:hover { background: var(--panel); color: var(--ink2); }
.think summary .chev { transition: transform .2s; }
.think[open] summary .chev { transform: rotate(90deg); }
.think .tx { margin: 6px 0 2px 16px; padding-left: 14px; border-left: 2px solid var(--line2); white-space: pre-wrap; font-size: 13.5px; line-height: 1.6; max-height: 340px; overflow-y: auto; }
.shimmer { background: linear-gradient(90deg, var(--muted) 0%, var(--ink) 45%, var(--muted) 90%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shim 1.8s linear infinite; }
@keyframes shim { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.live-think .tx { max-height: 4.8em; overflow: hidden; -webkit-mask-image: linear-gradient(to top, #000 50%, transparent); mask-image: linear-gradient(to top, #000 50%, transparent); display: flex; flex-direction: column-reverse; }

/* tools */
.tools { display: flex; flex-direction: column; gap: 2px; padding-left: 2px; }
.tool { border-radius: 10px; }
.tool .th { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 5px 10px; border-radius: 10px; color: var(--muted); font-size: 13.5px; transition: background .12s, color .12s; }
.tool .th:hover { background: var(--panel); color: var(--ink2); }
.tool .th .ti { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); flex: none; color: var(--muted); }
.tool .th .tt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tool .th .chev { color: var(--faint); transition: transform .2s; }
.tool.open .th .chev { transform: rotate(90deg); }
.tool .stat { width: 16px; height: 16px; display: grid; place-items: center; }
.tool .stat.ok { color: var(--ok); } .tool .stat.err { color: var(--bad); }
.spin { width: 13px; height: 13px; border: 2px solid var(--line2); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.tool .tb { display: none; margin: 4px 0 8px 45px; }
.tool.open .tb { display: block; animation: rise .2s ease both; }
.pane { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--code); margin-bottom: 6px; }
.pane .ph { display: flex; align-items: center; gap: 6px; padding: 5px 10px; font: 11.5px var(--mono); color: var(--faint); background: var(--panel); border-bottom: 1px solid var(--line); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.pane pre { margin: 0; padding: 10px 12px; font: 12.5px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto; color: var(--ink2); }
.pane pre .pr { color: var(--accent); user-select: none; }
.pane.err pre { color: var(--bad); }
.diff .dl { display: block; padding: 0 12px; margin: 0 -12px; }
.diff .dl.del { background: var(--bad-soft); color: var(--bad); }
.diff .dl.add { background: var(--ok-soft); color: var(--ok); }
.todos { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 10px 14px; display: grid; gap: 5px; font-size: 14px; }
.todos .tdh { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--faint); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 2px; }
.todo { display: flex; gap: 10px; align-items: flex-start; color: var(--ink2); }
.todo .bx { width: 17px; height: 17px; border-radius: 6px; border: 1.5px solid var(--faint); flex: none; margin-top: 3px; display: grid; place-items: center; }
.todo.completed { color: var(--faint); text-decoration: line-through; }
.todo.completed .bx { background: var(--ok); border-color: var(--ok); color: #fff; }
.todo.in_progress { color: var(--ink); font-weight: 500; }
.todo.in_progress .bx { border-color: var(--accent); box-shadow: inset 0 0 0 3px var(--panel), inset 0 0 0 10px var(--accent); }

.msg.system { align-self: center; font-size: 12.5px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); padding: 4px 12px; border-radius: 99px; text-align: center; max-width: 90%; }
.msg.switch { border: 1px solid var(--accent-line); background: linear-gradient(135deg, var(--accent-soft), transparent); border-radius: var(--r); padding: 12px 16px; font-size: 14px; display: flex; gap: 12px; }
.msg.switch .si { width: 32px; height: 32px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.msg.switch details { margin-top: 6px; font-size: 13px; color: var(--muted); }
.msg.switch summary { cursor: pointer; }
.msg.switch pre { white-space: pre-wrap; max-height: 320px; overflow: auto; font: 12px/1.5 var(--mono); background: var(--code); padding: 10px; border-radius: 8px; border: 1px solid var(--line); }

/* ---------- dock (approvals + composer) */
#dock { padding: 0 16px calc(14px + env(safe-area-inset-bottom)); position: relative; }
#dock::before { content: ""; position: absolute; left: 0; right: 0; top: -30px; height: 30px; background: linear-gradient(to top, var(--bg), transparent); pointer-events: none; }
.dockin { width: min(780px, 100%); margin: 0 auto; }
#perms { display: grid; gap: 10px; }
.ask { margin-bottom: 10px; border-radius: 18px; background: var(--panel); border: 1px solid var(--accent-line); box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow); padding: 14px 16px; animation: rise .25s ease both; max-height: 52vh; overflow-y: auto; }
.ask .aq { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
.ask .aq .ai { width: 30px; height: 30px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.ask .why { color: var(--muted); font-size: 13px; margin-top: 6px; }
.ask .pane { margin-top: 10px; }
.ask .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.ask .where { color: var(--faint); font-size: 12px; align-self: center; }
.ask.mini { display: flex; align-items: center; gap: 10px; padding: 9px 10px 9px 14px; box-shadow: var(--shadow); font-size: 14px; }
.ask.mini .mt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ask.qcard { padding: 18px 20px 16px; max-height: 70vh; outline: none; }
.qcard .qcount { margin-left: auto; font-weight: 500; font-size: 12.5px; color: var(--faint); }
.qsteps { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.qstep { display: flex; align-items: center; gap: 6px; max-width: 100%; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line2); background: var(--panel2); font-size: 12.5px; color: var(--muted); }
.qstep b { font-weight: 600; flex: none; }
.qstep span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px; color: var(--text, inherit); }
.qstep.done { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
.qstep.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.qblock { margin-top: 14px; }
.qblock .qq { font-weight: 600; font-size: 17px; line-height: 1.35; margin: 0 0 4px; }
.qblock .qsub { color: var(--faint); font-size: 12.5px; margin-bottom: 10px; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; padding: 11px 14px; border-radius: 14px; border: 1px solid var(--line2); background: var(--panel2); transition: border-color .12s, background .12s, transform .06s; display: flex; gap: 12px; align-items: center; width: 100%; }
.opt:hover { border-color: var(--accent-line); background: var(--panel3); }
.opt:active { transform: scale(.995); }
.opt.on { border-color: var(--accent); background: var(--accent-soft); }
.opt .ok { width: 24px; height: 24px; border-radius: 7px; border: 1px solid var(--line2); background: var(--panel); color: var(--muted); font-size: 12px; font-weight: 600; flex: none; display: grid; place-items: center; }
.opt .ot { flex: 1; min-width: 0; }
.opt .ob { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--faint); flex: none; display: grid; place-items: center; color: transparent; }
.opt.multi .ob { border-radius: 6px; }
.opt.on .ob { border-color: var(--accent); background: var(--accent); color: #fff; }
.opt.on .ok { border-color: var(--accent); color: var(--accent); }
.opt .ol { font-weight: 600; font-size: 14.5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.opt .rec { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--ok); background: var(--ok-soft); padding: 2px 7px; border-radius: 999px; }
.qcard .other { margin-top: 8px; width: 100%; }
.qcard .row { align-items: center; }
.qcard .qhint { margin-left: auto; color: var(--faint); font-size: 12px; }
@media (max-width: 700px) { .qcard .qhint, .opt .ok { display: none; } }
.opt .od { color: var(--muted); font-size: 13px; margin-top: 2px; line-height: 1.4; }
.other { width: 100%; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--line2); background: var(--panel2); outline: 0; font-size: 14px; }
.other:focus { border-color: var(--accent-line); }
.planbox { margin-top: 10px; padding: 12px 16px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); max-height: 36vh; overflow-y: auto; }

#status { display: flex; align-items: center; gap: 10px; min-height: 30px; padding: 0 6px 6px; color: var(--muted); font-size: 13px; }
#status .dots { display: inline-flex; gap: 4px; }
#status .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: bob 1.2s infinite ease-in-out; }
#status .dots i:nth-child(2) { animation-delay: .15s; } #status .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes bob { 0%, 80%, 100% { transform: scale(.5); opacity: .4; } 40% { transform: scale(1); opacity: 1; } }
#status .tm { font-family: var(--mono); font-size: 12px; color: var(--faint); }
#status .prog { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); max-width: 55%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

#composer { position: relative; background: var(--panel); border: 1px solid var(--line2); border-radius: 22px; box-shadow: var(--shadow); transition: border-color .2s, box-shadow .2s; }
#composer:focus-within { border-color: var(--accent-line); box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow); }
#composer.disabled { opacity: .6; }
#tray { display: flex; gap: 8px; padding: 12px 12px 0; flex-wrap: wrap; }
#tray:empty { display: none; }
.att { position: relative; width: 64px; height: 64px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line2); background: var(--panel2); display: grid; place-items: center; }
.att img { width: 100%; height: 100%; object-fit: cover; }
.att.file { width: auto; max-width: 200px; padding: 0 12px; display: flex; gap: 7px; font-size: 12.5px; color: var(--ink2); }
.att.file span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att .x { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; background: rgba(0,0,0,.65); color: #fff; display: grid; place-items: center; }
.att .ov { position: absolute; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; }
.att.bad { border-color: var(--bad); }
#text { display: block; width: 100%; resize: none; border: 0; outline: 0; background: none; padding: 14px 18px 6px; min-height: 52px; max-height: 40vh; font-size: 15.5px; line-height: 1.5; }
#text::placeholder { color: var(--faint); }
.cbar { display: flex; align-items: center; gap: 4px; padding: 6px 8px 8px; }
.cchips { display: flex; gap: 4px; align-items: center; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.cchips::-webkit-scrollbar { display: none; }
.cchip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 10px; font-size: 13px; color: var(--muted); white-space: nowrap; transition: background .12s, color .12s; flex: none; }
.cchip:hover:not(:disabled) { background: var(--panel2); color: var(--ink); }
.cchip.hot { color: var(--accent); }
.cchip.plan { color: #8fb4ff; }
.cchip.rec { color: #ff6b6b; animation: recp 1.2s ease-in-out infinite; }
@keyframes recp { 50% { opacity: .45; } }
/* Conversation memory: plain faint words, only while the pointer is over the bar under the message box. */
#ctx { font-size: 12.5px; color: var(--faint); white-space: nowrap; padding: 0 8px; opacity: 0; transition: opacity .2s; pointer-events: none; flex: none; }
.cbar:hover #ctx { opacity: 1; }
#modStatus { font-size: 12.5px; color: var(--faint); white-space: nowrap; padding: 0 8px; flex: none; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
#modStatus:empty { display: none; }
#send { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(180deg, var(--accent), var(--accent2)); color: #fff; box-shadow: 0 2px 10px rgba(201,100,59,.35); transition: transform .1s, filter .15s, opacity .15s; flex: none; }
#send:hover:not(:disabled) { filter: brightness(1.08); }
#send:active:not(:disabled) { transform: scale(.94); }
#send.stop { background: var(--ink); color: var(--bg); box-shadow: none; }
#send:disabled { opacity: .35; box-shadow: none; }
#slash { position: absolute; left: 10px; right: 10px; bottom: calc(100% + 8px); background: var(--panel); border: 1px solid var(--line2); border-radius: 14px; box-shadow: var(--shadow); max-height: 300px; overflow-y: auto; padding: 6px; display: none; z-index: 10; }
#slash.show { display: block; }
.sc { display: flex; gap: 10px; padding: 7px 10px; border-radius: 9px; cursor: pointer; align-items: baseline; }
.sc.on, .sc:hover { background: var(--panel2); }
.sc b { font-family: var(--mono); font-weight: 500; font-size: 13px; color: var(--accent); white-space: nowrap; }
.sc span { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hint { color: var(--faint); font-size: 11.5px; text-align: center; padding-top: 7px; }

/* ---------- popover menu */
#menu { position: fixed; z-index: 60; min-width: 240px; max-width: min(360px, calc(100vw - 20px)); max-height: 70vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line2); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; display: none; animation: pop .14s ease both; }
#menu.show { display: block; }
@keyframes pop { from { opacity: 0; transform: translateY(4px) scale(.98); } to { opacity: 1; transform: none; } }
.mh { padding: 6px 10px 4px; font-size: 11px; color: var(--faint); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
.mi { display: flex; gap: 10px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 9px; align-items: flex-start; }
.mi:hover:not(:disabled) { background: var(--panel2); }
.mi .mic { color: var(--muted); margin-top: 2px; }
.mi .mt { flex: 1; min-width: 0; }
.mi .ml { font-size: 14px; font-weight: 500; }
.mi .md2 { font-size: 12.5px; color: var(--muted); line-height: 1.4; }
.mi .ck { color: var(--accent); margin-top: 2px; }
.mi.danger .ml, .mi.danger .mic { color: var(--bad); }
.msep { height: 1px; background: var(--line); margin: 5px 4px; }

/* ---------- modal */
#modal { position: fixed; inset: 0; z-index: 70; background: rgba(8,6,4,.55); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; padding: 16px; }
#modal.show { display: flex; }
.card { background: var(--panel); border: 1px solid var(--line2); border-radius: 20px; box-shadow: var(--shadow); width: min(560px, 100%); max-height: calc(100dvh - 32px); display: flex; flex-direction: column; animation: pop .18s ease both; }
.card .chd { display: flex; align-items: center; gap: 10px; padding: 16px 18px 10px; }
.card .chd h3 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 25px; flex: 1; }
.card .cbd { padding: 0 18px 12px; overflow-y: auto; }
.card .cft { padding: 12px 18px 16px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; border-top: 1px solid var(--line); }
.card p { color: var(--ink2); margin: .5em 0; }
.card pre.cmd { background: var(--code); border: 1px solid var(--line); padding: 10px 12px; border-radius: 10px; white-space: pre-wrap; word-break: break-all; font: 12.5px var(--mono); user-select: all; }
.crumbs { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; font-size: 13px; color: var(--muted); padding: 8px 10px; background: var(--panel2); border-radius: 10px; margin-bottom: 8px; }
.crumbs button { padding: 2px 6px; border-radius: 6px; color: var(--ink2); }
.crumbs button:hover { background: var(--panel3); }
.flist { border: 1px solid var(--line); border-radius: 12px; max-height: 46vh; overflow-y: auto; }
.fi { display: flex; align-items: center; gap: 10px; padding: 9px 12px; cursor: pointer; border-bottom: 1px solid var(--line); font-size: 14px; }
.fi:last-child { border-bottom: 0; }
.fi:hover { background: var(--panel2); }
.fi .ic { color: var(--accent); }
.fi .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fi .g { font-size: 11px; color: var(--ok); }
.newf { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
.newf input[type=text] { flex: 1; min-width: 160px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line2); background: var(--panel2); outline: 0; }
.newf label { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.qr { display: grid; place-items: center; padding: 14px; background: #fff; border-radius: 16px; width: 220px; margin: 8px auto 14px; }
.qr svg { width: 192px; height: 192px; display: block; }
.urlbox { text-align: center; font: 14px var(--mono); padding: 10px; background: var(--panel2); border-radius: 10px; word-break: break-all; user-select: all; }
.loglist { font: 12px/1.7 var(--mono); color: var(--ink2); }
.loglist div { padding: 4px 0; border-bottom: 1px solid var(--line); }
.steps { margin: 6px 0; padding-left: 1.3em; color: var(--ink2); } .steps li { margin: 6px 0; }
#viewer { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.85); display: none; place-items: center; cursor: zoom-out; padding: 20px; overflow: hidden; touch-action: none; }
#viewer.show { display: grid; }
#viewer img { max-width: calc(100vw - 40px); max-height: calc(100vh - 40px); max-height: calc(100dvh - 40px); object-fit: contain; border-radius: 10px; transform-origin: 0 0; user-select: none; -webkit-user-drag: none; }
#viewer.zoomed img { cursor: grab; border-radius: 0; }

/* ---------- drop + toasts */
#drop { position: fixed; inset: 0; z-index: 90; display: none; place-items: center; background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(4px); pointer-events: none; }
#drop.show { display: grid; }
#drop div { padding: 34px 50px; border: 2px dashed var(--accent); border-radius: 24px; font-family: var(--serif); font-size: 30px; color: var(--accent); background: var(--accent-soft); }
#toasts { position: fixed; left: 50%; transform: translateX(-50%); top: 14px; z-index: 95; display: grid; gap: 8px; width: min(440px, calc(100vw - 24px)); pointer-events: none; }
.toast { pointer-events: auto; background: var(--panel); border: 1px solid var(--line2); border-left: 3px solid var(--accent); border-radius: 12px; padding: 10px 14px; box-shadow: var(--shadow); font-size: 14px; animation: pop .2s ease both; }
.toast.bad { border-left-color: var(--bad); }
.toast b { display: block; font-size: 13.5px; }
.toast span { color: var(--muted); font-size: 13px; }
#scrim { display: none; }

/* ---------- phone */
@media (max-width: 860px) {
  #side { position: fixed; top: 0; bottom: 0; left: 0; width: min(330px, 88vw); transform: translateX(-102%); transition: transform .28s cubic-bezier(.3,.7,.2,1); box-shadow: var(--shadow); padding-top: env(safe-area-inset-top); }
  #side.open { transform: none; }
  #scrim { display: block; position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .25s; }
  #scrim.show { opacity: 1; pointer-events: auto; }
  .brand .close { display: inline-grid; }
  #menuBtn { display: inline-grid; margin-left: -6px; }
  #top { padding: 8px 10px; padding-top: calc(8px + env(safe-area-inset-top)); min-height: 54px; }
  #chat { padding: 16px 14px 24px; }
  #dock { padding: 0 8px calc(8px + env(safe-area-inset-bottom)); }
  #text { font-size: 16px; padding: 12px 14px 4px; }
  .cbar { padding: 4px 6px 6px; }
  .cchips { gap: 0; }
  .cchip { padding: 6px 8px; gap: 5px; }
  .md { font-size: 15.5px; }
  .tool .tb { margin-left: 8px; }
  .hint { display: none; }
  .topacts .wide { display: none; }
  .msg.assistant .acts { opacity: 1; position: static; justify-content: flex-end; margin-top: 2px; }
  .hero { margin-top: 7vh; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
/* cute "fetching your chat" critter while a project loads */
.loadpet { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; min-height:50vh; color:var(--muted); font-size:14px; animation: lpIn .25s ease; }
.loadpet .pet { position:relative; width:64px; height:54px; animation: lpHop .9s cubic-bezier(.3,.7,.4,1) infinite; }
.loadpet .body { position:absolute; inset:0; border-radius:50% 50% 44% 44%; background:linear-gradient(180deg,var(--accent),var(--accent2)); box-shadow:0 6px 16px rgba(201,100,59,.3); }
.loadpet .ear { position:absolute; top:-7px; width:16px; height:18px; background:var(--accent); border-radius:50% 50% 0 0; }
.loadpet .ear.l { left:8px; transform:rotate(-18deg); } .loadpet .ear.r { right:8px; transform:rotate(18deg); }
.loadpet .eye { position:absolute; top:20px; width:7px; height:9px; background:#2b1a12; border-radius:50%; animation: lpBlink 3s infinite; }
.loadpet .eye.l { left:19px; } .loadpet .eye.r { right:19px; }
.loadpet .cheek { position:absolute; top:31px; width:9px; height:5px; background:rgba(255,170,190,.8); border-radius:50%; }
.loadpet .cheek.l { left:11px; } .loadpet .cheek.r { right:11px; }
.loadpet .mouth { position:absolute; top:31px; left:50%; width:8px; height:4px; margin-left:-4px; border-bottom:2px solid #2b1a12; border-radius:0 0 50% 50%; }
.loadpet .shadow { width:46px; height:7px; border-radius:50%; background:rgba(0,0,0,.18); animation: lpShadow .9s cubic-bezier(.3,.7,.4,1) infinite; margin-top:-8px; }
.loadpet .dots span { display:inline-block; animation: lpDot 1.2s infinite; } .loadpet .dots span:nth-child(2){animation-delay:.15s} .loadpet .dots span:nth-child(3){animation-delay:.3s}
@keyframes lpHop { 0%,100% { transform:translateY(0) scale(1.08,.92); } 15% { transform:translateY(0) scale(.95,1.05); } 50% { transform:translateY(-22px) scale(1,1); } 85% { transform:translateY(0) scale(1.05,.95); } }
@keyframes lpShadow { 0%,100% { transform:scale(1); opacity:.9; } 50% { transform:scale(.6); opacity:.4; } }
@keyframes lpBlink { 0%,92%,100% { transform:scaleY(1); } 95% { transform:scaleY(.1); } }
@keyframes lpDot { 0%,60%,100% { transform:translateY(0); opacity:.4; } 30% { transform:translateY(-4px); opacity:1; } }
@keyframes lpIn { from { opacity:0; transform:translateY(6px); } }
@media (prefers-reduced-motion: reduce) { .loadpet * { animation:none !important; } }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand">
      <img class="logo" src="/icon.svg" alt="">
      <span class="word">Hy<i>dra</i></span>
      <button class="iconbtn close" id="sideClose" title="Close"></button>
    </div>
    <div class="sideacts">

    </div>
    <div class="sidetools">

      <button class="iconbtn" id="openFolder" title="Open any folder" style="background:var(--panel);border:1px solid var(--line)"></button>
    </div>
    <div id="plist"></div>
    <div class="sidefoot">
      <div class="acctwrap" id="acctwrap">
        <div id="acctpop"><div class="apcard">
          <div class="aph"><span>Your accounts</span><button id="refresh"><span data-i="refresh" data-c="xs"></span>Check again</button></div>
          <div id="accts"></div>
        </div></div>
        <button class="acctbtn" id="acctBtn"><span class="adots" id="adots"></span>Accounts</button>
      </div>
      <button class="iconbtn" id="showlog" title="Switch log"><span data-i="history" data-c="sm"></span></button>
      <button class="iconbtn" id="showphone" title="Use it on your phone"><span data-i="phone" data-c="sm"></span></button>
    </div>
  </aside>
  <div id="scrim"></div>

  <main id="main">
    <header id="top">
      <button class="iconbtn" id="menuBtn" title="Projects"></button>
      <div class="ptitle"><div class="t" id="ptitle">Hydra</div><div class="m" id="pmeta"></div></div>
      <div class="topacts" id="topacts"></div>
    </header>
    <div id="pastbar"></div>
    <div id="banner"></div>
    <div id="scroll"><div id="chat"></div></div>
    <div id="dock"><div class="dockin">
      <div id="perms"></div>
      <div id="status"></div>
      <div id="composer">
        <div id="slash"></div>
        <div id="tray"></div>
        <textarea id="text" rows="1" placeholder="Message Claude…" disabled></textarea>
        <div class="cbar">
          <div class="cchips">
            <button class="cchip" id="photosBtn" title="Pick photos from your gallery" hidden></button>
            <button class="cchip" id="attach" title="Attach files or pictures"></button>
            <button class="cchip" id="micBtn" title="Talk instead of typing" hidden></button>
            <button class="cchip" id="modeChip" title="How much Claude asks first"></button>
            <button class="cchip" id="modelChip" title="Model"></button>
            <button class="cchip" id="effortChip" title="How hard Claude thinks"></button>
            <span id="ctx"></span>
            <span id="modStatus" title="token-diet"></span>
          </div>
          <button id="send" title="Send" disabled></button>
        </div>
      </div>
      <div class="hint">Enter to send · Shift+Enter for a new line · paste or drop screenshots · type / for commands</div>
    </div></div>
  </main>
</div>
<input type="file" id="file" multiple hidden>
<!-- Photos only: on a phone this opens the gallery picker (tap several) instead of the camera/files chooser -->
<input type="file" id="photos" accept="image/*" multiple hidden>
<div id="menu"></div>
<div id="modal"></div>
<div id="pal"><div class="palc">
  <label class="palin"><span data-i="search"></span><input id="palq" placeholder="Find a project…" autocomplete="off" spellcheck="false"></label>
  <div class="pall" id="pall"></div>
  <div class="palf"><span>★ pins a project to the top of the sidebar</span><button class="btn sm" id="palOpen"><span data-i="folderPlus" data-c="sm"></span>Open another folder</button></div>
</div></div>

<script>
// ============================================================ helpers
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const touch = matchMedia('(pointer: coarse)').matches;
const narrow = () => matchMedia('(max-width: 860px)').matches;

const P = {
  menu: 'M4 6h16M4 12h16M4 18h16', x: 'M18 6L6 18M6 6l12 12', plus: 'M12 5v14M5 12h14',
  search: 'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-4.3-4.3',
  folder: 'M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2.2h7.5A2.5 2.5 0 0 1 21 9.7v7.8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z',
  folderPlus: 'M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2.2h7.5A2.5 2.5 0 0 1 21 9.7v7.8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5zM12 11v6M9 14h6',
  branch: 'M6 3v12M18 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 9a9 9 0 0 1-9 9',
  clip: 'M21.4 11.1l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5',
  up: 'M12 19V5M5 12l7-7 7 7', stop: 'M7 7h10v10H7z',
  term: 'M4 17l6-6-6-6M12 19h8', pencil: 'M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z',
  file: 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6',
  globe: 'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM2 12h20M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10 15 15 0 0 1-4-10 15 15 0 0 1 4-10z',
  list: 'M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01', check: 'M20 6L9 17l-5-5',
  chev: 'M9 18l6-6-6-6', chevDown: 'M6 9l6 6 6-6',
  spark: 'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z',
  shield: 'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z', map: 'M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14',
  chip: 'M9 9h6v6H9zM5 5h14v14H5zM9 2v3M15 2v3M9 19v3M15 19v3M19 9h3M19 15h3M2 9h3M2 15h3',
  gauge: 'M12 14l4-4M3.3 19a10 10 0 1 1 17.4 0', phone: 'M8 2h8a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zM12 18h.01',
  refresh: 'M21 12a9 9 0 1 1-2.6-6.4L21 8M21 3v5h-5', history: 'M3 12a9 9 0 1 0 2.6-6.4L3 8M3 3v5h5M12 7v5l3 2',
  swap: 'M7 16V4M3 8l4-4 4 4M17 8v12M21 16l-4 4-4-4', note: 'M5 3h14v18H5zM9 8h6M9 12h6M9 16h3',
  more: 'M5 12h.01M12 12h.01M19 12h.01', copy: 'M9 9h11v11H9zM5 15H4V4h11v1',
  chatPlus: 'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2zM12 7v6M9 10h6',
  chat: 'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z',
  image: 'M4 4h16v16H4zM9 10a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM20 15l-5-5L4 20', bot: 'M12 8V4H8M5 8h14v12H5zM2 14h3M19 14h3M15 13v2M9 13v2',
  trash: 'M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6', back: 'M19 12H5M12 19l-7-7 7-7', bell: 'M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0',
  question: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01', brain: 'M12 5a3 3 0 0 0-5.9-.9A3 3 0 0 0 4 9a3 3 0 0 0 0 6 3 3 0 0 0 3 4 3 3 0 0 0 5 0 3 3 0 0 0 5 0 3 3 0 0 0 3-4 3 3 0 0 0 0-6 3 3 0 0 0-2.1-4.9A3 3 0 0 0 12 5zM12 5v14',
  pin: 'M12 17v5M8.5 3h7l-1.2 6.2 3.7 3.8H6l3.7-3.8z',
  star: 'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z',
  grid: 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z',
  mic: 'M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v3M8 21h8',
  play: 'M7 4l13 8-13 8z', bolt: 'M13 2L4 14h7l-1 8 9-12h-7z', git: 'M6 3v12M18 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 9a9 9 0 0 1-9 9',
};
const ic = (n, c = '') => `<svg class="i ${c}" viewBox="0 0 24 24" aria-hidden="true"><path d="${P[n] || P.spark}"/></svg>`;
document.querySelectorAll('[data-i]').forEach(el => { el.outerHTML = ic(el.dataset.i, el.dataset.c || ''); });
$('#sideClose').innerHTML = ic('x'); $('#menuBtn').innerHTML = ic('menu'); $('#openFolder').innerHTML = ic('folderPlus', 'sm');
$('#attach').innerHTML = ic('clip', 'sm');
$('#photosBtn').innerHTML = ic('image', 'sm'); $('#photosBtn').hidden = !touch;

const when = t => {
  if (!t) return '?';
  const d = new Date(t), now = new Date();
  const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  if (d.toDateString() === now.toDateString()) return time;
  const tm = new Date(now); tm.setDate(now.getDate() + 1);
  if (d.toDateString() === tm.toDateString()) return 'tomorrow ' + time;
  return d.toLocaleDateString([], { weekday: 'short' }) + ' ' + time;
};
const span = ms => { ms = Math.max(0, ms); const h = Math.floor(ms / 3600e3), m = Math.floor(ms % 3600e3 / 60e3), s = Math.floor(ms % 60e3 / 1e3);
  return (h ? h + 'h ' : '') + String(m).padStart(h ? 2 : 1, '0') + 'm ' + String(s).padStart(2, '0') + 's'; };
const clock = ms => { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const ago = t => { const s = (Date.now() - t) / 1000; if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + 'm ago'; if (s < 86400) return Math.floor(s / 3600) + 'h ago'; return Math.floor(s / 86400) + 'd ago'; };

function toast(title, body, bad) {
  const el = document.createElement('div');
  el.className = 'toast' + (bad ? ' bad' : '');
  el.innerHTML = body ? `<b>${esc(title)}</b><span>${esc(body)}</span>` : esc(title);
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, bad ? 7000 : 4500);
}
async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { toast(j.error || 'Something went wrong', '', true); throw new Error(j.error); }
  return j;
}

// ============================================================ markdown
marked.setOptions({ gfm: true, breaks: true });
DOMPurify.addHook('afterSanitizeAttributes', n => { if (n.tagName === 'A') { n.setAttribute('target', '_blank'); n.setAttribute('rel', 'noopener noreferrer'); } });
function md(text) {
  const html = DOMPurify.sanitize(marked.parse(String(text || '')));
  const box = document.createElement('div'); box.innerHTML = html;
  box.querySelectorAll('pre > code').forEach(code => {
    const lang = (code.className.match(/language-([\w+-]+)/) || [])[1] || '';
    if (window.hljs) { try { lang && hljs.getLanguage(lang) ? hljs.highlightElement(code) : (code.textContent.length < 20000 && hljs.highlightElement(code)); } catch {} }
    const pre = code.parentElement, wrap = document.createElement('div');
    wrap.className = 'codeblk';
    const runnable = SHELLS.has(lang.toLowerCase()) && code.textContent.trim();
    wrap.innerHTML = `<div class="ch"><span>${esc(lang || 'text')}</span><span class="cbtns">${runnable ? `<button data-run>${ic('play', 'xs')}Run</button><button data-runwin title="Opens a PowerShell window on the PC and runs it there, so you can type into it">Terminal</button>` : ''}<button data-copy>${ic('copy', 'xs')}Copy</button></span></div>`;
    pre.replaceWith(wrap); wrap.appendChild(pre);
    if (runnable) paintRun(wrap, ranCmds.get(runKey(code.textContent)));
  });
  return box.innerHTML;
}

// ---- Run button on shell blocks: runs it in PowerShell on the PC, in the project folder
const SHELLS = new Set(['bash', 'sh', 'shell', 'powershell', 'ps1', 'ps', 'pwsh', 'console']);
const ranCmds = new Map();   // project + command -> { busy, code, out }; survives the chat redrawing
const runKey = cmd => current + '\n' + cmd.trim();
function paintRun(wrap, st) {
  const b = wrap.querySelector('[data-run]');
  wrap.querySelector('.runout')?.remove();
  if (!b) return;
  b.disabled = !!st?.busy;
  b.innerHTML = st?.busy ? `<span class="spin"></span>Running` : `${ic('play', 'xs')}${st ? 'Run again' : 'Run'}`;
  if (!st || (st.busy && !st.out)) return;

// Keep the page's list in step with the server's open workers (they come and go mid-chat).
function syncWorkers() {

function drawProjects() {

// Drag to reorder main projects and quick chats. Mouse: press and move.
// Phone: hold a moment, then move (a quick swipe still scrolls the list).
// The held row follows the pointer and the others slide out of its way; the
// list itself is only reordered once the row has settled into its new slot.
const plist = $('#plist');
const EASE = 'cubic-bezier(.2,.8,.2,1)';
function dragStart() {
  if (!drag || !drag.row.isConnected) { drag = null; return; }
  const d = drag, top0 = d.list.getBoundingClientRect().top;
  d.rows = [...d.list.children];
  d.from = d.to = d.rows.indexOf(d.row);
  d.box = d.rows.map(r => { const b = r.getBoundingClientRect(); return { top: b.top - top0, h: b.height }; });
  d.y0rel = d.y0 - top0;
  d.on = true;
  d.row.classList.add('dragging'); d.list.classList.add('sorting'); plist.classList.add('dragging');
  try { plist.setPointerCapture(d.id); } catch {}
  if (d.touch) navigator.vibrate?.(15);
}
function dragMove(y) {
  const d = drag, me = d.box[d.from], end = d.box[d.box.length - 1];
  let dy = y - d.list.getBoundingClientRect().top - d.y0rel;
  dy = Math.max(d.box[0].top - me.top, Math.min(end.top + end.h - me.top - me.h, dy));   // stays inside its own list
  d.row.style.transform = `translateY(${dy}px)`;
  const mid = me.top + dy + me.h / 2;
  let to = 0;
  d.box.forEach((b, i) => { if (i !== d.from && mid > b.top + b.h / 2) to++; });
  if (to === d.to) return;
  d.to = to;
  d.rows.forEach((r, i) => {
    if (i === d.from) return;
    const shift = i > d.from && i <= to ? -me.h : i < d.from && i >= to ? me.h : 0;
    r.style.transform = shift ? `translateY(${shift}px)` : '';
  });
}
function dragEnd(cancel) {
  const d = drag;
  if (!d || d.settling) return;
  clearTimeout(d.timer);
  if (!d.on) { drag = null; return; }
  dragEnded = Date.now(); d.settling = true;
  if (cancel) { d.to = d.from; d.rows.forEach(r => { if (r !== d.row) r.style.transform = ''; }); }
  // Glide into the empty slot, then really reorder.
  const me = d.box[d.from], b = d.box[d.to];
  const dy = d.to > d.from ? b.top + b.h - me.h - me.top : d.to < d.from ? b.top - me.top : 0;
  d.row.style.transition = `transform .17s ${EASE}, scale .17s ${EASE}, box-shadow .17s`;
  d.row.style.transform = `translateY(${dy}px)`;
  d.row.classList.add('landing');
  setTimeout(() => {
    drag = null; plist.classList.remove('dragging');
    if (d.to !== d.from) {
      const order = d.rows.map(r => r.dataset.p);
      order.splice(d.to, 0, ...order.splice(d.from, 1));
      if (d.kind === 'pinned') S.pinned = [...order, ...(S.pinned || []).filter(x => !order.includes(x))];
      else S.quickOrder = [...order, ...(S.quickOrder || []).filter(x => !order.includes(x))];
      post('/api/order', { kind: d.kind, list: d.kind === 'pinned' ? S.pinned : S.quickOrder }).catch(() => {});
    }
    drawProjects();
  }, 180);
}
plist.addEventListener('pointerdown', e => {
  const row = e.target.closest('.dlist > .proj');
  if (drag || !row || e.button || e.target.closest('button') || !S) return;
  const list = row.parentElement;
  if (list.children.length < 2) return;
  drag = { row, list, kind: list.dataset.kind, id: e.pointerId, x0: e.clientX, y0: e.clientY, on: false, touch: e.pointerType !== 'mouse' };
  if (drag.touch) drag.timer = setTimeout(dragStart, 380);
});
plist.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id || drag.settling) return;
  const moved = Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0);
  if (!drag.on) {
    if (drag.touch) { if (moved > 8) { clearTimeout(drag.timer); drag = null; } return; }   // moved before the hold: it's a scroll
    if (moved < 5) return;
    dragStart(); if (!drag) return;
  }
  e.preventDefault();
  // Near the top or bottom edge: scroll the sidebar along.
  const box = plist.getBoundingClientRect();
  if (e.clientY < box.top + 30) plist.scrollTop -= 10; else if (e.clientY > box.bottom - 30) plist.scrollTop += 10;

});

// ---------------- all-projects finder (Ctrl+K)
const finder = { open: new Set(), hl: 0 };
function openFinder(shelf) {
  closeSide();

  if (typeof shelf === 'string') finder.open.add(shelf);
  else if (current && curProject()) finder.open.add(shelfOf(curProject()));

  const before = JSON.stringify(projects);
  $('#pal').classList.add('show'); drawFinder(); loadProjects(true).then(() => { if ($('#pal').classList.contains('show') && JSON.stringify(projects) !== before) drawFinder(); }).catch(() => {});
  setTimeout(() => $('#palq').focus(), 30);
}
function closeFinder() { $('#pal').classList.remove('show'); }
function finderRow(p, flat, nested) {
  const mid = nested ? '' : midOf(p);
  return `<div class="prow${nested ? ' nest' : ''}" data-p="${esc(p.path)}" title="${esc(p.quick ? p.name : p.path)}"><span class="ic">${ic(iconOf(p), 'sm')}</span>
    <span class="nm">${esc(leafOf(p))}${mid ? ` <span class="sub">${esc(mid)}</span>` : ''}${flat ? ` <span class="sub">· ${esc(shelfOf(p))}</span>` : ''}</span>
    ${p.lastAt ? `<span class="sub">${esc(ago(p.lastAt))}</span>` : ''}
    <button class="star${isPinned(p.path) ? ' on' : ''}" data-star="${esc(p.path)}" title="${isPinned(p.path) ? 'Unpin' : 'Pin as a main project'}">${ic('star', 'sm')}</button></div>`;
}
function drawFinder() {
  const q = $('#palq').value.trim().toLowerCase();
  const box = $('#pall');
  box.classList.toggle('flat', !!q);
  if (q) {
    const words = q.split(/\s+/);
    const hits = projects.filter(p => shown(p) && words.every(w => p.name.toLowerCase().includes(w)))
      .sort((a, b) => (leafOf(b).toLowerCase().startsWith(q)) - (leafOf(a).toLowerCase().startsWith(q)) || (b.lastAt || 0) - (a.lastAt || 0));
    box.innerHTML = hits.length ? hits.map(p => finderRow(p, true)).join('') : `<div class="prow" style="cursor:default;color:var(--muted)">Nothing called "${esc(q)}". Try <b style="margin:0 4px">Open another folder</b> below.</div>`;
  } else {
    const shelves = new Map();
    for (const p of projects.filter(shown)) { const s = shelfOf(p); if (!shelves.has(s)) shelves.set(s, []); shelves.get(s).push(p); }
    const last = ['C:\\Projects', 'Other folders', 'Quick chats'];
    const order = [...shelves.keys()].sort((a, b) => last.indexOf(a) - last.indexOf(b) || a.localeCompare(b));
    box.innerHTML = order.map(s => {
      const list = s === 'Quick chats' ? shelves.get(s).sort((a, b) => (b.lastAt || 0) - (a.lastAt || 0))
        : shelves.get(s).sort((a, b) => (midOf(a) + leafOf(a)).localeCompare(midOf(b) + leafOf(b), undefined, { sensitivity: 'base' }));
      const open = finder.open.has(s);
      // Inside a group: its own projects first, then each folder within it (Games › Puzzle) under a small heading.
      let rows = '';
      if (open) {
        const subs = new Map([['', []]]);
        for (const p of list) { const m = midOf(p); if (!subs.has(m)) subs.set(m, []); subs.get(m).push(p); }
        for (const [m, ps] of subs) if (ps.length) rows += (m ? `<div class="psub">${ic('folder', 'xs')}${esc(m)}</div>` : '') + ps.map(p => finderRow(p, false, !!m)).join('');
      }
      return `<button class="pg${open ? ' open' : ''}" data-shelf="${esc(s)}">${ic('chev', 'xs chev')}${ic(s === 'Quick chats' ? 'chat' : 'folder', 'sm')}${esc(s === 'C:\\Projects' ? 'Loose in C:\\Projects' : s)}<span class="cnt">${list.length}</span></button>` + rows;
    }).join('');

}
function markHl() {
  const rows = [...$('#pall').querySelectorAll('.prow[data-p]')];
  rows.forEach((r, i) => r.classList.toggle('hl', i === finder.hl && !!$('#palq').value.trim()));

}
$('#palq').oninput = () => { finder.hl = 0; drawFinder(); };
$('#palq').onkeydown = e => {
  const rows = [...$('#pall').querySelectorAll('.prow[data-p]')];
  if (e.key === 'ArrowDown') { e.preventDefault(); finder.hl = Math.min(rows.length - 1, finder.hl + 1); markHl(); }
  if (e.key === 'ArrowUp') { e.preventDefault(); finder.hl = Math.max(0, finder.hl - 1); markHl(); }

// The row pressed, kept in case the list was redrawn before the button came back up (the click then lands elsewhere).
let palDown = null;

$('#pal').onclick = e => {
  const downOn = palDown; palDown = null;

// Picture viewer: wheel / pinch zooms where you point, drag moves, double-click toggles zoom, click outside (or unzoomed) closes.
const vz = (() => {
  const V = $('#viewer'), I = V.querySelector('img'), pts = new Map();
  let s = 1, x = 0, y = 0, moved = false, last = null, pinch = null;
  const apply = () => { I.style.transform = `translate(${x}px,${y}px) scale(${s})`; V.classList.toggle('zoomed', s > 1.01); };
  const zoomAt = (cx, cy, ns) => {
    ns = Math.min(12, Math.max(1, ns));
    const r = I.getBoundingClientRect(), bx = r.left - x, by = r.top - y;
    const u = (cx - bx - x) / s, v = (cy - by - y) / s;
    s = ns; if (s === 1) { x = y = 0; } else { x = cx - bx - u * s; y = cy - by - v * s; }
    apply();
  };
  const reset = () => { s = 1; x = y = 0; pts.clear(); apply(); };
  V.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, s * Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
  V.addEventListener('pointerdown', e => {
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); V.setPointerCapture(e.pointerId);
    if (pts.size === 1) { moved = false; last = { x: e.clientX, y: e.clientY }; }
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), s }; moved = true; }
  });
  V.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2 && pinch) { const [a, b] = [...pts.values()]; zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, pinch.s * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d); return; }
    if (pts.size === 1 && last) {
      const dx = e.clientX - last.x, dy = e.clientY - last.y; last = { x: e.clientX, y: e.clientY };
      if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
      if (s > 1) { x += dx; y += dy; apply(); }
    }
  });
  const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (pts.size === 1) last = [...pts.values()][0]; };
  V.addEventListener('pointerup', up); V.addEventListener('pointercancel', up);
  let shut = null;   // a single click closes, but waits a moment so a double-click can zoom instead
  V.addEventListener('dblclick', e => { clearTimeout(shut); zoomAt(e.clientX, e.clientY, s > 1.01 ? 1 : 3); });
  V.addEventListener('click', e => { if (moved || (s > 1.01 && e.target === I) || e.detail > 1) return; clearTimeout(shut); shut = setTimeout(() => V.classList.remove('show'), 250); });
  return { reset };
})();

// One question on screen at a time, with the others as chips to jump between.
const qAnswer = (r, st, qi) => [...(st[qi] instanceof Set ? st[qi] : []), ...((st['o' + qi] || '').trim() ? [st['o' + qi].trim()] : [])].join(', ');
const recRe = /\s*\(recommended\)\s*$/i;
function qCardHtml(r) {
  const st = qState[r.id] || (qState[r.id] = { step: 0 });
  const n = r.questions.length, qi = Math.min(st.step || 0, n - 1), q = r.questions[qi], last = qi === n - 1;
  const steps = n > 1 ? `<div class="qsteps">${r.questions.map((x, i) => { const a = qAnswer(r, st, i); return `<button class="qstep${i === qi ? ' on' : a ? ' done' : ''}" data-step="${i}" title="${esc(x.question)}"><b>${a && i !== qi ? ic('check', 'xs') : i + 1}</b>${esc(x.header || 'Question ' + (i + 1))}${a && i !== qi ? `<span>${esc(a.replace(/\s*\(recommended\)/ig, ''))}</span>` : ''}</button>`; }).join('')}</div>` : '';
  const opts = q.options.map((o, i) => `<button class="opt${q.multi ? ' multi' : ''}${st[qi]?.has?.(o.label) ? ' on' : ''}" data-q="${qi}" data-o="${esc(o.label)}"><span class="ok">${i + 1}</span><span class="ot"><div class="ol">${esc(o.label.replace(recRe, ''))}${recRe.test(o.label) ? '<span class="rec">Recommended</span>' : ''}</div>${o.description ? `<div class="od">${esc(o.description)}</div>` : ''}</span><span class="ob">${ic('check', 'xs')}</span></button>`).join('');
  return `<div class="ask qcard" data-id="${esc(r.id)}" tabindex="-1"><div class="aq"><span class="ai">${ic('question', 'sm')}</span>Claude has ${n > 1 ? n + ' questions' : 'a question'}${n > 1 ? `<span class="qcount">${qi + 1} of ${n}</span>` : ''}</div>
    ${steps}
    <div class="qblock"><div class="qq">${esc(q.question)}</div><div class="qsub">${q.multi ? 'Pick as many as you like' : 'Pick one'}, or type your own below</div>
      <div class="opts">${opts}</div>
      <input class="other" data-other="${qi}" placeholder="Something else? Type it here…" value="${esc(st['o' + qi] || '')}"></div>
    <div class="row">${qi > 0 ? `<button class="btn" data-step="${qi - 1}">Back</button>` : ''}<button class="btn primary" data-next="1">${last ? ic('check', 'sm') + (n > 1 ? 'Send answers' : 'Send answer') : 'Next'}</button><button class="btn ghost" data-deny="${esc(r.id)}">Skip</button><span class="qhint">Press 1–${q.options.length} to pick${q.multi || last ? ', Enter to ' + (last ? 'send' : 'go on') : ''}</span></div></div>`;
}
function redrawQ(id, focusOther) {
  const r = S.perms.find(x => x.id === id), el = document.querySelector(`.ask[data-id="${CSS.escape(id)}"]`);
  if (!r || !el) return;
  el.outerHTML = qCardHtml(r);
  const card = document.querySelector(`.ask[data-id="${CSS.escape(id)}"]`);
  card.style.animation = 'none';
  (focusOther ? card.querySelector('.other') : card).focus({ preventScroll: true });
}
// Move on from the question on screen: to the next one, or send when every one has an answer.
function qNext(id) {
  const r = S.perms.find(x => x.id === id), st = qState[id];
  if (!r || !st) return;
  const qi = Math.min(st.step || 0, r.questions.length - 1);
  if (!qAnswer(r, st, qi)) { toast('Pick an answer first, or press Skip'); return; }
  const missing = r.questions.findIndex((q, i) => !qAnswer(r, st, i));
  if (qi < r.questions.length - 1) st.step = qi + 1;
  else if (missing >= 0) st.step = missing;

}
function qPick(id, qi, label) {

  st[qi] = st[qi] instanceof Set ? st[qi] : new Set();
  if (q.multi) { st[qi].has(label) ? st[qi].delete(label) : st[qi].add(label); redrawQ(id); return; }
  st[qi] = new Set([label]); st['o' + qi] = '';

// Number keys pick, Enter moves on, as long as he is not typing somewhere else.
// Arrow keys skip 5 s in the chat video last played or clicked (unless typing somewhere).
let lastVid = null;
document.addEventListener('play', e => { if (e.target.tagName === 'VIDEO') lastVid = e.target; }, true);
document.addEventListener('pointerdown', e => { if (e.target.tagName === 'VIDEO') lastVid = e.target; }, true);
// Leaving a full-screen video: the browser loses the chat's scroll spot (it resizes
// the page meanwhile), so put the video back where it was on screen.
var fsKeep = null;   // var: drawChat may read it before this line runs
function fsEnter(v) { const s = $('#scroll'); if (v?.tagName === 'VIDEO' && s.contains(v)) fsKeep = { v, top: s.scrollTop, off: v.getBoundingClientRect().top - s.getBoundingClientRect().top }; }
function fsExit() {
  const k = fsKeep; fsKeep = null;
  if (drawLater) { drawLater = false; drawChat(); }
  if (!k) return;
  const put = () => { const s = $('#scroll'); s.scrollTop = k.v.isConnected ? s.scrollTop + (k.v.getBoundingClientRect().top - s.getBoundingClientRect().top) - k.off : k.top; };
  put(); requestAnimationFrame(put); setTimeout(put, 150); setTimeout(put, 400);
}
document.addEventListener('fullscreenchange', () => { const f = document.fullscreenElement; if (f) fsEnter(f.tagName === 'VIDEO' ? f : f.querySelector?.('video')); else fsExit(); });
document.addEventListener('webkitbeginfullscreen', e => fsEnter(e.target), true);   // iPhone's own video player
document.addEventListener('webkitendfullscreen', () => fsExit(), true);
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || !lastVid?.isConnected) return;
  const a = document.activeElement;
  if (a && a !== lastVid && (/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) || a.isContentEditable)) return;
  const d = { ArrowLeft: -5, ArrowRight: 5 }[e.key]; if (!d) return;
  e.preventDefault(); e.stopPropagation();
  lastVid.currentTime = Math.max(0, Math.min(lastVid.duration || 0, lastVid.currentTime + d));
}, true);
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const card = document.querySelector('#perms .qcard'); if (!card) return;
  const a = document.activeElement, inOther = a?.classList?.contains('other') && card.contains(a);
  const typing = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) || a?.isContentEditable;
  const id = card.dataset.id, r = S.perms.find(x => x.id === id), st = qState[id]; if (!r || !st) return;
  const qi = Math.min(st.step || 0, r.questions.length - 1);
  if (e.key === 'Enter' && (inOther || !typing) && !(a?.tagName === 'BUTTON')) { e.preventDefault(); qNext(id); return; }
  if (typing) return;

});
$('#perms').addEventListener('click', e => {

function sendAnswer(id) {
