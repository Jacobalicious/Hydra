};
$('#topacts').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'gitinit') { await post('/api/git-init', { project: current }); await loadProjects(); openProject(current); }
  if (b.id === 'newchat') { if (curProject()?.quick) startQuick(); else newChat(); }
  if (b.id === 'closeworker') { if (!confirm('Close this worker? It stops, and its copy of the project is deleted. Its branch is kept if it is not merged yet.')) return; const lead = curProject()?.lead; await post('/api/worker/close', { project: current }); if (lead) openProject(lead); return; }
  if (b.id === 'pinbtn') { const on = !isPinned(current); await setPin(current, on); toast(on ? leafOf(curProject()) + ' is now a main project' : 'Unpinned'); }
  if (b.id === 'more') {
    const p = curProject(), runHere = !!runOf(current);
    if (p.quick) return openMenu(b, [
      mi('newq', 'New quick chat', 'This one stays in the list.', 'chatPlus'),
      mi('switch', 'Switch account now', 'Move this chat to the next account.', 'swap'),
    ].join(''), v => { if (v === 'newq') startQuick(); if (v === 'switch') post('/api/switch', { project: current }); });
    openMenu(b, [
      mi('new', 'New conversation', 'Start fresh in this folder. The old one is kept.', 'chatPlus'),
      mi('past', 'Past conversations', 'Read older chats from this folder.', 'history'),
      mi('note', 'Write the handoff note now', runHere ? 'Claude brings HANDOFF.md up to date and commits it.' : 'Only while a conversation is running here.', 'note', false, runHere ? '' : 'off'),
      mi('switch', 'Switch account now', 'Move this project to the next account.', 'swap'),
      !p.git ? mi('git', 'Set up git', 'Needed for safe handoffs.', 'git') : '',
      '<div class="msep"></div>',
      mi('copy', 'Copy folder path', p.path, 'copy'),
      p.added ? mi('remove', 'Remove from list', 'The folder itself is not touched.', 'trash', false, 'danger') : '',
    ].join(''), async v => {
      if (v === 'new') newChat();
      if (v === 'past') showPastList();
      if (v === 'note') { if (runHere) post('/api/note', { project: current }); else toast('Nothing running here', 'The note is as current as the last session left it.'); }
      if (v === 'switch') post('/api/switch', { project: current });
      if (v === 'git') { await post('/api/git-init', { project: current }); await loadProjects(); openProject(current); }
      if (v === 'copy') { copyText(p.path); toast('Copied the folder path'); }
      if (v === 'remove') { await post('/api/folder/remove', { path: p.path }); current = null; items = []; await loadProjects(); drawChat(); drawAll(); }
    });
  }
});
async function newChat() {
  if (!current) return;
  const busy = !!runOf(current)?.busy;
  if (busy && !confirm('Claude is still working here. Stop it and start a new conversation?')) return;
  await post('/api/new', { project: current });
}

    else if (canPush && Notification.permission === 'denied') alerts = `<p><b>Alerts are blocked</b> for this site in your browser's settings. Allow notifications for it there, then open this again.</p>`;
    else if (canPush) { alerts = `<p>Want a buzz when Claude is done or needs you, even with the page closed?</p>`; btn = `<button class="btn" id="notifOn">${ic('bell', 'sm')}Alert me on this phone</button>`; }
    else if (isIOS) alerts = `<p><b>For alerts on iPhone</b>, open Hydra from its home-screen icon (Share, then <b>Add to Home Screen</b>), then tap this button again from there.</p>`;
    else alerts = `<p>This browser can't show alerts. Chrome on Android can.</p>`;
  }

  const n = $('#notifOn');

    catch (e) { toast('Could not switch alerts on', e.message, true); n.disabled = false; }
  };
  const t = $('#notifTest');
  if (t) t.onclick = async () => { const r = await post('/api/push/test', { endpoint: pushSub.endpoint }); toast(r.sent ? 'Test alert sent' : 'The test alert did not go through', r.sent ? 'It should pop up in a few seconds.' : 'Try switching alerts off and on in the browser settings.', !r.sent); };
};

// ---------- phone alerts (Web Push): sw.js shows them, even with the page closed
const onPC = ['127.0.0.1', 'localhost'].includes(location.hostname);
const canPush = window.isSecureContext && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const fromB64u = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - s.length % 4) % 4)), c => c.charCodeAt(0));
const toB64u = b => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
let pushSub = null;
async function pushSetup(ask) {
  if (!canPush) return false;
  const reg = await navigator.serviceWorker.register('/sw.js');
  await navigator.serviceWorker.ready;
  if (ask && Notification.permission === 'default') await Notification.requestPermission();
  if (Notification.permission !== 'granted') return false;
  const { key } = await (await fetch('/api/push/key')).json();
  let sub = await reg.pushManager.getSubscription();
  // Made with a different server key (data folder reset): start over.
  if (sub && sub.options?.applicationServerKey && toB64u(sub.options.applicationServerKey) !== key) { await sub.unsubscribe(); sub = null; }
  sub ||= await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: fromB64u(key) });
  await post('/api/push/subscribe', { sub: sub.toJSON() });
  pushSub = sub; return true;
}
// Already allowed (including phones that said yes to the old kind of alert): make sure the server has this phone.
if (!onPC && canPush && Notification.permission === 'granted') pushSetup(false).catch(() => {});
// Tapping an alert while the page is open in the background.
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => { const p = e.data?.open; if (p && projects.some(x => x.path === p)) openProject(p); });

// folder picker
let pick = { dir: '' };
async function folderPicker(dir = '') {
  closeSide();
  let j;
  try { const r = await fetch('/api/browse?dir=' + encodeURIComponent(dir)); j = await r.json(); if (!r.ok) throw new Error(j.error); }
  catch (e) { toast('Could not open that folder', e.message, true); return; }
  pick = j;
  const parts = j.dir ? j.dir.split('\\').filter(Boolean) : [];
  const crumbs = `<button data-dir="">${ic('folder', 'xs')} Places</button>` + parts.map((x, i) => `<span>›</span><button data-dir="${esc(parts.slice(0, i + 1).join('\\') + (i === 0 ? '\\' : ''))}">${esc(x)}</button>`).join('');
  const list = j.dirs.length ? j.dirs.map(d => `<div class="fi" data-dir="${esc(d.path)}"><span class="ic">${ic(d.git ? 'git' : 'folder', 'sm')}</span><span class="nm">${esc(d.name)}</span>${d.git ? '<span class="g">git</span>' : ''}${ic('chev', 'xs')}</div>`).join('')
    : `<div class="fi" style="cursor:default;color:var(--muted)">No folders inside${j.files ? ` (${j.files} files)` : ''}</div>`;
  modal('Open a folder', `<div class="crumbs">${crumbs}</div><div class="flist">${list}</div>
    ${j.dir ? `<div class="newf"><input type="text" id="nfName" placeholder="New folder name"><label><input type="checkbox" id="nfGit" checked> set up git</label><button class="btn sm" id="nfMake">${ic('folderPlus', 'sm')}Create here</button></div>` : ''}`,
    `<button class="btn" data-close>Cancel</button><button class="btn primary" id="useDir" ${j.dir && !/^[a-z]:\\?$/i.test(j.dir) ? '' : 'disabled'}>${ic('check', 'sm')}Use this folder</button>`, true);
  $('#modal .card').addEventListener('click', e => { const d = e.target.closest('[data-dir]'); if (d) folderPicker(d.dataset.dir); });
  const use = $('#useDir'); if (use) use.onclick = async () => { const r = await post('/api/folder/add', { path: pick.dir }); closeModal(); await loadProjects(); openProject(r.path); };
  const mk = $('#nfMake'); if (mk) mk.onclick = async () => { const name = $('#nfName').value.trim(); if (!name) return toast('Type a name for the new folder first'); const r = await post('/api/folder/new', { parent: pick.dir, name, git: $('#nfGit').checked }); closeModal(); await loadProjects(); openProject(r.path); toast('Made ' + name); };
}
$('#openFolder').onclick = () => folderPicker('');

// ============================================================ attachments
let attachments = [];   // { key, name, image, url, status: 'up'|'done'|'bad', id }
const uploading = () => attachments.some(a => a.status === 'up');
async function shrink(file) {
  if (!/^image\/(png|jpeg|webp)$/.test(file.type)) return file;
  try {
    const bmp = await createImageBitmap(file);
    const long = Math.max(bmp.width, bmp.height);
    if (long <= 2000 && file.size <= 3.5 * 1024 * 1024) return file;
    const k = Math.min(1, 2000 / long), c = document.createElement('canvas');
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.88));
    return new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' });
  } catch { return file; }
}
async function addFiles(list) {
  const into = attachments;
  if (!current) { toast('Pick a project first'); return; }
  for (let f of list) {
    if (!f.size) continue;
    if (/^image\.(png|jpe?g)$/i.test(f.name) || !f.name) f = new File([f], `screenshot-${new Date().toISOString().slice(0, 19).replace(/[T:]/g, '-')}.${(f.type.split('/')[1] || 'png').replace('jpeg', 'jpg')}`, { type: f.type });
    const a = { key: Math.random().toString(36).slice(2), name: f.name, image: f.type.startsWith('image/'), status: 'up' };
    if (a.image) a.url = URL.createObjectURL(f);
    into.push(a); drawTray(); drawAll();
    try {
      const g = await shrink(f);
      const r = await fetch('/api/upload?name=' + encodeURIComponent(g.name), { method: 'POST', body: g, headers: { 'Content-Type': 'application/octet-stream' } });
      const j = await r.json(); if (!r.ok) throw new Error(j.error);
      a.id = j.id; a.status = 'done';
    } catch (e) { a.status = 'bad'; toast('Could not attach ' + f.name, e.message, true); }
    drawTray(); drawAll();
  }
}
function drawTray() {
  const html = list => list.map(a => `<div class="att${a.image ? '' : ' file'}${a.status === 'bad' ? ' bad' : ''}" data-k="${a.key}" title="${esc(a.name)}">
    ${a.image ? `<img src="${a.url}" alt="">` : `${ic('file', 'sm')}<span>${esc(a.name)}</span>`}
    ${a.status === 'up' ? '<div class="ov"><span class="spin"></span></div>' : ''}
    <button class="x" data-rm="${a.key}" title="Remove">${ic('x', 'xs')}</button></div>`).join('');
  $('#tray').innerHTML = html(attachments);
}
$('#tray').onclick = e => { const k = e.target.closest('[data-rm]')?.dataset.rm; if (k) { attachments = attachments.filter(a => a.key !== k); drawTray(); drawAll(); } };
$('#attach').onclick = () => $('#file').click();
$('#file').onchange = e => { addFiles([...e.target.files]); e.target.value = ''; };
$('#photosBtn').onclick = () => $('#photos').click();
$('#photos').onchange = e => { addFiles([...e.target.files]); e.target.value = ''; };
document.addEventListener('paste', e => {
  const files = [...(e.clipboardData?.files || [])];
  if (files.length) { e.preventDefault(); addFiles(files); }
});
let dragN = 0;
addEventListener('dragenter', e => { if ([...e.dataTransfer.types].includes('Files')) { dragN++; $('#drop').classList.add('show'); } });
addEventListener('dragleave', () => { if (--dragN <= 0) { dragN = 0; $('#drop').classList.remove('show'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); dragN = 0; $('#drop').classList.remove('show'); if (e.dataTransfer.files.length) addFiles([...e.dataTransfer.files]); });

// ============================================================ composer
async function sendText() {
  const t = $('#text').value;
  if ((!t.trim() && !attachments.length) || !current) return;
  if (uploading()) { toast('Still attaching files…'); return; }
  const good = attachments.filter(a => a.status === 'done');
  micStop(true);
  const keepT = t, keepA = attachments;
  $('#text').value = ''; attachments = []; drawTray(); autosize(); hideSlash();
  const fresh = curProject()?.quick && !curProject().lastAt;
  try { await post('/api/send', { project: current, text: t, files: good.map(a => a.id) }); if (fresh) loadProjects().then(drawAll); }
  catch { $('#text').value = keepT; attachments = keepA; drawTray(); autosize(); }
  drawAll();
}
$('#send').onclick = () => { if ($('#send').classList.contains('stop')) post('/api/stop', { project: current }); else sendText(); };
$('#text').addEventListener('keydown', e => {
  if ($('#slash').classList.contains('show')) {
    const list = [...$('#slash').querySelectorAll('.sc')], i = list.findIndex(x => x.classList.contains('on'));
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const n = (i + (e.key === 'ArrowDown' ? 1 : -1) + list.length) % list.length; list.forEach(x => x.classList.remove('on')); list[n]?.classList.add('on'); list[n]?.scrollIntoView({ block: 'nearest' }); return; }
    if ((e.key === 'Tab' || e.key === 'Enter') && list[i]) { e.preventDefault(); pickSlash(list[i].dataset.cmd); return; }
  }
  if (e.key === 'Enter' && !e.shiftKey && !touch && !e.isComposing) { e.preventDefault(); sendText(); }
});
// ============================================================ mic (speech to text)
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recBase = '';
$('#micBtn').innerHTML = ic('mic', 'sm');
$('#micBtn').hidden = !SR;
function micStop(drop) { if (!rec) return; if (drop) { rec.onresult = null; recBase = ''; try { rec.abort(); } catch {} } else { try { rec.stop(); } catch {} } }
$('#micBtn').onclick = () => {
  if (rec) { micStop(); return; }
  if (!window.isSecureContext) { toast('Mic needs a secure page', 'Open Hydra over https (or on this PC at 127.0.0.1).', true); return; }
  const ta = $('#text'); if (ta.disabled) return;
  rec = new SR();
  rec.lang = navigator.language || 'en-US'; rec.continuous = true; rec.interimResults = true;
  recBase = ta.value && !/\s$/.test(ta.value) ? ta.value + ' ' : ta.value;
  rec.onresult = e => {
    let fin = '', mid = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i]; (r.isFinal ? (fin += r[0].transcript) : (mid += r[0].transcript));
    }
    if (fin) recBase += fin.trim() + ' ';
    ta.value = recBase + mid; autosize(); if (S) drawAll();
  };
  rec.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') toast('Mic blocked', 'Allow the microphone for this page in the browser.', true); else if (e.error !== 'no-speech' && e.error !== 'aborted') toast('Mic stopped', e.error, true); };
  rec.onend = () => { rec = null; $('#micBtn').classList.remove('rec'); $('#micBtn').title = 'Talk instead of typing'; const ta = $('#text'); if (ta.value.trim()) ta.value = ta.value.trimEnd(); autosize(); if (S) drawAll(); };
  try { rec.start(); $('#micBtn').classList.add('rec'); $('#micBtn').title = 'Stop listening'; }
  catch (err) { rec = null; toast('Mic did not start', err.message, true); }
};
function autosize() { const t = $('#text'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, innerHeight * 0.4) + 'px'; }
$('#text').addEventListener('input', () => { autosize(); drawSlash(); if (S) drawAll(); });

function drawSlash() {
  const v = $('#text').value, m = v.match(/^\/([\w:-]*)$/);
  if (!m || !S?.commands?.length) return hideSlash();
  const f = m[1].toLowerCase();
  const list = S.commands.filter(c => c.name.toLowerCase().includes(f)).sort((a, b) => a.name.toLowerCase().startsWith(f) ? -1 : b.name.toLowerCase().startsWith(f) ? 1 : 0).slice(0, 40);
  if (!list.length) return hideSlash();
  $('#slash').innerHTML = list.map((c, i) => `<div class="sc${i ? '' : ' on'}" data-cmd="${esc(c.name)}"><b>/${esc(c.name)}</b><span>${esc(c.description)}</span></div>`).join('');
  $('#slash').classList.add('show');
}
function hideSlash() { $('#slash').classList.remove('show'); }
function pickSlash(name) { $('#text').value = '/' + name + ' '; hideSlash(); $('#text').focus(); autosize(); }
$('#slash').onclick = e => { const c = e.target.closest('.sc'); if (c) pickSlash(c.dataset.cmd); };

// ============================================================ live updates
let offline = false, es = null;
const PAGE_VERSION = '__PAGE_VERSION__';
let staleBanner = false;
// Hydra was updated since this page loaded: reload, unless he is mid-typing.
let staleServer = false;
function pageUpdated() {
  if (!$('#text').value.trim()) { location.reload(); return; }
  if (staleBanner) return; staleBanner = true;
  toast('Hydra was updated', 'It will refresh once you send or clear your message.');
  const t = setInterval(() => { if (!$('#text').value.trim()) { clearInterval(t); location.reload(); } }, 2000);
}
function connect() {
  es = new EventSource('/api/events');
  es.onopen = async () => {
    if (offline) { offline = false; const seq = openSeq; await loadProjects(); const p = wanted || current; if (p && seq === openSeq) openProject(p); }   // reload the one last tapped, not the one shown
  };
  es.onmessage = e => {
    const ev = JSON.parse(e.data);
    if (ev.type === 'hello') {
      if (ev.page !== PAGE_VERSION && !PAGE_VERSION.startsWith('__')) pageUpdated();
      else if (ev.stale && !staleServer) { staleServer = true; toast('Restart Hydra to finish updating', 'Use Stop Hydra, then open Hydra again. Until then some buttons may say "Not found".', true); }
    }
    else if (ev.type === 'state') { S = ev.state; offline = false; syncWorkers(); drawAll(); markSeen(); }
    else if (ev.type === 'chat' && ev.project === current && past) past.saved.push(ev.item);
    else if (ev.type === 'chat' && ev.project === current) appendItem(ev.item);
    else if (ev.type === 'chat') { const p = projects.find(x => x.path === ev.project); if (p) p.lastAt = Date.now(); }
    else if (ev.type === 'stream' && ev.project === current && !past) onStream(ev);
    else if (ev.type === 'reset' && ev.project === current) { if (past) past.saved = []; else { items = []; drawChat(); } }
    else if (ev.type === 'notify') {
      if (document.hidden && pushSub) {}   // the phone's push alert covers it
      else if (document.hidden && onPC && 'Notification' in window && Notification.permission === 'granted') { try { new Notification(ev.title, { body: ev.body, icon: '/icon.svg' }); } catch {} }
      else if (!/done/i.test(ev.title) || document.hidden || (ev.project && ev.project !== current)) toast(ev.title, ev.body);
    }
  };
  es.onerror = () => { offline = true; drawStatus(); };
}
// The blue "done" dot goes away once he is actually looking at that chat.
function markSeen() { if (current && S?.done?.includes(current) && !document.hidden && document.hasFocus()) post('/api/seen', { project: current }).catch(() => {}); }
window.addEventListener('focus', markSeen);
document.addEventListener('visibilitychange', () => { if (!document.hidden && es?.readyState === 2) { es.close(); connect(); } });

(async () => {
  await loadProjects(true);   // picks up folders moved or made by hand
  connect();
  let last = null; try { last = localStorage.getItem('mc.project'); } catch {}
  const want = new URLSearchParams(location.search).get('open');   // opened by tapping an alert
  if (want) { last = want; history.replaceState(null, '', '/'); }
  if (last && projects.some(p => p.path === last)) openProject(last); else drawChat();
  if (window.hljs === undefined) addEventListener('load', () => { if (window.hljs && current) drawChat(); });
})();
</script>
